name: ESP32 Compilation Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        esp32-board:
          - esp32:esp32:esp32
          - esp32:esp32:esp32s3
          - esp32:esp32:esp32c3
    steps:
      - uses: actions/checkout@v4
      
      - name: Compile for ESP32
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.esp32-board }}
          libraries: |
            - source-path: ./
