name: Arduino Verification Check

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'library.properties'
      - '.github/workflows/verify.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'library.properties'
      - '.github/workflows/verify.yml'

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure Arduino CLI
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set library.enable_unsafe_install true

      - name: Cache ESP32 Core and Tools
        id: cache-esp32
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages/esp32
            ~/.arduino15/package_esp32_index.json
          key: ${{ runner.os }}-esp32-core-v3.0.0

      - name: Install ESP32 Platform Core
        if: steps.cache-esp32.outputs.cache-hit != 'true'
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install Project Dependencies
        run: |

          # Force CLI to update lib list
          arduino-cli lib update-index
          
          # 1. Install standard public registry libraries
          arduino-cli lib install "Alfredo-NoU3"
          arduino-cli lib install "PestoLink-Receive"
          arduino-cli lib install "Adafruit MCP23017 Arduino Library"
          arduino-cli lib install "Adafruit PWM Servo Driver Library"


      - name: Restructure and Flatten for Arduino
        run: |
          # 1. Create the parent folder
          mkdir -p build_dir
          
          # 2. Copy and rename main.ino so it perfectly matches the folder name
          cp src/main.ino build_dir/build_dir.ino
          
          # 3. Copy all your header and source files into the flat folder
          cp src/*.cpp build_dir/ 2>/dev/null || true
          cp src/*.h build_dir/ 2>/dev/null || true

      - name: Verify and Compile Sketch
        run: |
          # Crucial: Ensure your repository name matches the exact folder name containing your main .ino file
          arduino-cli compile --fqbn esp32:esp32:esp32s3 build_dir/


name: Arduino Library Verify

# Trigger the workflow on pushes and pull requests to the main branch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Lint the Arduino Library structure and rules
      - name: Arduino Lint
        uses: arduino/arduino-lint-action@v1
        with:
          compliance: strict

      # Step 3: Install Arduino CLI
      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      # Step 4: Install the required core platform(s)
      # This example installs the classic AVR board core (Uno, Mega, Nano)
      - name: Cache ESP32 Core and Tools
        id: cache-esp32
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages/esp32
            ~/.arduino15/package_esp32_index.json
          key: ${{ runner.os }}-esp32-core-v3.0.0

      - name: Install ESP32 Platform Core
        if: steps.cache-esp32.outputs.cache-hit != 'true'
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      # Step 5: (Optional) Install external library dependencies
      - name: Install Project Dependencies
        run: |

          # Force CLI to update lib list
          arduino-cli lib update-index
          
          # 1. Install standard public registry libraries
          arduino-cli lib install "Alfredo-NoU3"
          arduino-cli lib install "PestoLink-Receive"
          arduino-cli lib install "Adafruit MCP23017 Arduino Library"
          arduino-cli lib install "Adafruit PWM Servo Driver Library"

      # Step 6: Compile the library examples
      # Replace 'MyLibraryExample' with the actual name of an .ino file in your examples folder
      - name: Verify Compile Examples
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s3 examples/GPIO_Check/GPIO_Check.ino
